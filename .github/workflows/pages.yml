name: Build and deploy MCPE Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure Web build
        run: emcmake cmake -S . -B build -G Ninja -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

      - name: Compile WebAssembly game
        run: cmake --build build --target MinecraftPE --parallel 2

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp build/index.html _site/index.html
          cp build/MinecraftPE.js _site/MinecraftPE.js
          cp build/MinecraftPE.wasm _site/MinecraftPE.wasm
          if [[ -f build/MinecraftPE.data ]]; then cp build/MinecraftPE.data _site/MinecraftPE.data; fi
          if [[ -f build/MinecraftPE.worker.js ]]; then cp build/MinecraftPE.worker.js _site/MinecraftPE.worker.js; fi
          test -s _site/index.html
          test -s _site/MinecraftPE.js
          test -s _site/MinecraftPE.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
