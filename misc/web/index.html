<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>โลกของเรา</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080808; overscroll-behavior: none; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
    #canvas { width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
    #orientation-gate { display: none; position: fixed; z-index: 20; inset: 0; place-items: center; padding: 24px; text-align: center; background: #111; color: #fff; font: 700 18px/1.45 system-ui, sans-serif; }
    #orientation-gate span { display: block; max-width: 320px; }
    @media (orientation: portrait) and (pointer: coarse) { #orientation-gate.show { display: grid; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="orientation-gate" aria-live="polite"><span>กรุณาหมุนโทรศัพท์เป็นแนวนอนเพื่อเล่นเกม</span></div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function (error) { console.warn('Offline cache unavailable', error); });
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () { resizeCanvas(); Module.canvas.focus(); }
    };
    function resizeCanvas() {
      var canvas = Module.canvas;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function isGameplay() { return window.__mcpeGameplay === true; }
    function isPortrait() { return window.innerHeight > window.innerWidth; }
    function updateMobileShell() {
      var gameplay = isGameplay();
      var portrait = isPortrait();
      document.getElementById('orientation-gate').classList.toggle('show', gameplay && portrait);
      if (gameplay && !portrait && !document.fullscreenElement && Module.canvas.requestFullscreen) {
        Module.canvas.requestFullscreen().then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      }
    }
    window.addEventListener('resize', function () { resizeCanvas(); updateMobileShell(); }, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(function () { resizeCanvas(); updateMobileShell(); }, 100); }, { passive: true });
    document.addEventListener('fullscreenchange', updateMobileShell);
    window.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    window.addEventListener('gesturestart', function (event) { event.preventDefault(); });
    window.addEventListener('beforeunload', function () { if (typeof FS !== 'undefined' && FS.syncfs) FS.syncfs(true, function () {}); });
    window.setInterval(updateMobileShell, 250);
  </script>
  <script src="MinecraftPE.js"></script>
</body>
</html>
