<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>โลกของเรา</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080808; overscroll-behavior: none; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
    /* The engine surface must remain the complete physical viewport. Do not inset it. */
    #game-viewport { position: fixed; inset: 0; overflow: hidden; background: #080808; }
    #canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
    #orientation-gate {
      display: none;
      position: fixed;
      z-index: 20;
      inset: 0;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
      text-align: center;
      background: #10182a;
      color: #fff;
      font: 700 18px/1.45 system-ui, sans-serif;
    }
    #orientation-gate span { display: block; max-width: 360px; }
    /* Apply before WebAssembly starts, so the loading screen is never shown in portrait. */
    @media (orientation: portrait) and (pointer: coarse) { #orientation-gate, #orientation-gate.show { display: grid; } }
  </style>
</head>
<body>
  <div id="game-viewport"><canvas id="canvas" tabindex="0"></canvas></div>
  <div id="orientation-gate" aria-live="polite"><span>กรุณาหมุนโทรศัพท์เป็นแนวนอน<br>เพื่อให้พื้นที่เล่นและปุ่มควบคุมไม่ถูกบัง</span></div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function (error) { console.warn('Offline cache unavailable', error); });
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () { resizeCanvas(); Module.canvas.focus(); updateMobileShell(); }
    };
    function resizeCanvas() {
      var canvas = Module.canvas;
      var width = Math.max(1, window.innerWidth);
      var height = Math.max(1, window.innerHeight);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }
    function isPortrait() { return window.innerHeight > window.innerWidth; }
    function updateMobileShell() {
      var portrait = isPortrait();
      document.getElementById('orientation-gate').classList.toggle('show', portrait && matchMedia('(pointer: coarse)').matches);
      if (!portrait && !document.fullscreenElement && Module.canvas.requestFullscreen) {
        Module.canvas.requestFullscreen().then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      }
      resizeCanvas();
    }
    window.addEventListener('resize', updateMobileShell, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(updateMobileShell, 150); }, { passive: true });
    document.addEventListener('fullscreenchange', updateMobileShell);
    document.addEventListener('pointerdown', function () {
      if (!isPortrait() && !document.fullscreenElement && Module.canvas.requestFullscreen) {
        Module.canvas.requestFullscreen().then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      }
    }, { passive: true });
    window.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    window.addEventListener('gesturestart', function (event) { event.preventDefault(); });
    window.addEventListener('beforeunload', function () { if (typeof FS !== 'undefined' && FS.syncfs) FS.syncfs(true, function () {}); });
    window.setInterval(updateMobileShell, 250);
  </script>
  <script src="MinecraftPE.js"></script>
</body>
</html>
